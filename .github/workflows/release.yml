name: Release

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser target
        type: choice
        options:
          - chrome
          - firefox
          - both
        default: chrome
      publish_target:
        description: Chrome publish target (trustedTesters or default)
        type: choice
        options:
          - trustedTesters
          - default
        default: trustedTesters
      create_release:
        description: Create GitHub Release with zip files
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build & zip (chrome)
        if: inputs.browser == 'chrome' || inputs.browser == 'both'
        run: pnpm zip

      - name: Build & zip (firefox)
        if: inputs.browser == 'firefox' || inputs.browser == 'both'
        run: pnpm zip:firefox

      - name: Submit to Chrome Web Store
        if: inputs.browser == 'chrome' || inputs.browser == 'both'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: inputs.browser == 'firefox' || inputs.browser == 'both'
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: pnpm wxt submit --firefox-zip .output/*-firefox.zip

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: .output/*.zip
          generate_release_notes: true
